# plugin.yaml — Hermes Agent snap manifest for CT Engine
#
# Hermes uses the CT Engine in SIDECAR MODE. 
# The CT Engine relays the dashboard URL and status back to the Control Tower.
# All keys defined here can be managed via the Control Tower UI.

app:
  name: "all-dev-hermesagent"
  version: "0.12.0"

config:
  # --- Service Control ---
  dashboard-service:
    required: false
    type: string
    default: "enabled"
    description: "Enable/disable the web dashboard"
  gateway-service:
    required: false
    type: string
    default: "disabled"
    description: "Enable/disable the messaging gateway (Telegram/Discord/Slack)"
  agent-service:
    required: false
    type: string
    default: "disabled"
    description: "Enable/disable the autonomous agent daemon"
  acp-service:
    required: false
    type: string
    default: "disabled"
    description: "Enable/disable the ACP adapter"

  # --- Web Dashboard Access ---
  # A non-loopback dashboard bind always requires auth. Set a username +
  # password and the dashboard daemon binds 0.0.0.0; leave them unset and it
  # stays on 127.0.0.1. The plaintext password is hashed by the configure
  # hook and then cleared from snap config.
  dashboard-username:
    required: false
    type: string
    description: "Dashboard login username (enables LAN access)"
  dashboard-password:
    required: false
    type: string
    description: "Dashboard login password (hashed on set, then cleared)"
  dashboard-host:
    required: false
    type: string
    description: "Dashboard bind address override (0.0.0.0 or 127.0.0.1)"

  # --- LLM Provider Settings ---
  model:
    required: false
    type: string
    default: "gpt-4o"
    description: "Full model string (e.g., openrouter/deepseek/deepseek-r1)"
  model-provider:
    required: false
    type: string
    description: "LLM provider name (openai, openrouter, anthropic, etc.)"
  model-name:
    required: false
    type: string
    description: "Specific model name"
  
  # --- API Keys (Secrets) ---
  openrouter-api-key:
    required: false
    type: string
    description: "OpenRouter API Key"
  openai-api-key:
    required: false
    type: string
    description: "OpenAI API Key"
  anthropic-api-key:
    required: false
    type: string
    description: "Anthropic API Key"
  gemini-api-key:
    required: false
    type: string
    description: "Google Gemini API Key"
  deepseek-api-key:
    required: false
    type: string
    description: "DeepSeek API Key"
  xai-api-key:
    required: false
    type: string
    description: "xAI API Key"
  
  # --- Messaging Tokens ---
  telegram-bot-token:
    required: false
    type: string
    description: "Telegram Bot Token from BotFather"
  discord-bot-token:
    required: false
    type: string
    description: "Discord Bot Token"
  
  # --- Tool API Keys ---
  exa-api-key:
    required: false
    type: string
    description: "Exa Search API Key"
  tavily-api-key:
    required: false
    type: string
    description: "Tavily Search API Key"
  
  # --- System Settings ---
  log-level:
    required: false
    type: string
    default: "info"
    description: "Logging level (debug, info, warning, error)"
  personality:
    required: false
    type: string
    description: "Custom system prompt for the agent"

# Sidecar mode: the engine doesn't manage the hermes process directly
run:
  command: ""

# Reports the dashboard URL in every callback
sidecar:
  status_command: 'hostname -I | awk ''{print "dashboard: http://" $1 ":9119"}'''

output:
  mode: "logs"
  interval: 0
  initial_event: "message_initial"
  stop_event: "deployment_stop"

