# plugin.yaml — Hermes Agent snap manifest for CT Engine
#
# Hermes uses the CT Engine in SIDECAR MODE only.
# No config is delivered at deployment time — the user configures
# everything via the web dashboard at http://<device-ip>:9119.
#
# The CT Engine's job is to relay the dashboard URL back to the
# Control Tower so the user knows where to access the app.

app:
  name: "hermes"
  version: "0.12.0"

config:
  model:
    required: false
    type: string
    default: "gpt-4o"
    description: "LLM model to use"
  log-level:
    required: false
    type: string
    default: "info"
    description: "Logging level"
  agent-service:
    required: false
    type: string
    default: "disabled"
    description: "Enable/disable the agent daemon"
  acp-service:
    required: false
    type: string
    default: "disabled"
    description: "Enable/disable the ACP adapter"
  dashboard-service:
    required: false
    type: string
    default: "enabled"
    description: "Enable/disable the web dashboard"

# No app to launch — ct-engine runs as a sidecar alongside the other services
run:
  command: ""

# Sidecar status: this command's output becomes the callback message
# It discovers the local IP and reports the dashboard URL
sidecar:
  status_command: hostname -I | awk '{print "dashboard: http://" $1 ":9119"}'

output:
  mode: "logs"
  interval: 5
  initial_event: "message_initial"
  periodic_event: "message"
  stop_event: "deployment_stop"
