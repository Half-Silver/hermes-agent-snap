app:
  name: "hermes-agent"
  version: "0.12.0"

config:
  model: { required: false, type: "string", default: "gpt-4o" }
  personality: { required: false, type: "string", default: "Helpful assistant" }
  log-level: { required: false, type: "string", default: "info" }
  agent-service: { required: false, type: "string", default: "disabled" }
  acp-service: { required: false, type: "string", default: "disabled" }
  dashboard-service: { required: false, type: "string", default: "disabled" }

# Sidecar mode: ct-engine runs alongside the app daemons and only sends
# status callbacks to the Control Tower. It does NOT launch the app itself.
run:
  command: ""

output:
  mode: "logs"
  interval: 5
  initial_event: "message_initial"
  periodic_event: "message"
  stop_event: "deployment_stop"
