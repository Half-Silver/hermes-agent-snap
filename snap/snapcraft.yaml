name: hermes-agent
base: core24
version: '0.12.0'
summary: The self-improving AI agent
title: Hermes Agent
license: Apache-2.0
contact: developers@nousresearch.com
source-code: https://github.com/NousResearch/hermes-agent
issues: https://github.com/NousResearch/hermes-agent/issues
website: https://hermes-agent.nousresearch.com
description: |
  Hermes is an AI agent that creates skills from experience, 
  improves them during use, and runs anywhere.
  It features advanced tool-calling, web browsing, and 
  cross-platform messaging capabilities.

grade: stable
confinement: strict

apps:
  hermes:
    command: bin/hermes-wrapper hermes
    common-id: hermes
    aliases: [hermes]
    plugs:
      - network
      - network-bind
      - home
      - dot-hermes
      - ssh-keys
      - removable-media
  agent:
    command: bin/hermes-wrapper hermes-agent
    daemon: simple
    install-mode: disable
    post-stop: bin/hermes-wrapper stop-message
    aliases: [hermes-agent]
    plugs:
      - network
      - network-bind
      - home
      - dot-hermes
      - ssh-keys
      - removable-media
  acp:
    command: bin/hermes-wrapper hermes-acp
    daemon: simple
    install-mode: disable
    post-stop: bin/hermes-wrapper stop-message
    aliases: [hermes-acp]
    plugs:
      - network
      - network-bind
      - home
      - dot-hermes
  ct-engine:
    command: bin/ct-engine
    plugs:
      - network
      - network-bind
  dashboard:
    command: bin/hermes-wrapper dashboard-service
    daemon: simple
    install-mode: disable
    post-stop: bin/hermes-wrapper stop-message
    plugs:
      - network
      - network-bind
      - home
      - dot-hermes

plugs:
  dot-hermes:
    interface: personal-files
    write:
      - $HOME/.hermes

parts:
  all-snap-plugin:
    plugin: dump
    source: ../all_snap_plugin
    organize:
      src/ct_engine.py: bin/ct-engine
      docs: docs/plugin
      examples: examples/plugin

  web-frontend:
    plugin: npm
    source: web/
    npm-include-node: true
    npm-node-version: '20'
    override-build: |
      export NODE_ENV=development
      npm install -g typescript vite
      npm install --include=dev
      npm run sync-assets
      tsc -b
      vite build
      mkdir -p $CRAFT_PART_INSTALL/hermes_cli/web_dist
      cp -r ../hermes_cli/web_dist/* $CRAFT_PART_INSTALL/hermes_cli/web_dist/
  
  hermes-agent:
    plugin: python
    after: [web-frontend]
    source: .
    python-packages:
      - .[all]
    build-packages:
      - libffi-dev
      - libssl-dev
      - pkg-config
    stage-packages:
      - git
      - ripgrep
      - ffmpeg
      - curl

  browser-tools:
    plugin: npm
    source: .
    npm-include-node: true
    npm-node-version: '20'
    build-packages:
      - python3
      - make
      - g++
    override-build: |
      # Install dependencies locally to get agent-browser binary
      npm install
      
      # Force agent-browser to install into the part's install dir
      export HOME=$CRAFT_PART_INSTALL
      ./node_modules/.bin/agent-browser install
      
      # Move to a cleaner location and cleanup the fake HOME
      mkdir -p $CRAFT_PART_INSTALL/usr/share/playwright
      mv $CRAFT_PART_INSTALL/.agent-browser/browsers/* $CRAFT_PART_INSTALL/usr/share/playwright/
      rm -rf $CRAFT_PART_INSTALL/.agent-browser
      
      # Now run the default build (global install to prefix)
      unset HOME
      craftctl default
      
      # Also bundle Camoufox if possible
      # Camoufox usually downloads to ~/.cache/camoufox
      # We'll set CAMOUFOX_DIR to bundle it.
      export CAMOUFOX_DIR=$CRAFT_PART_INSTALL/usr/share/camoufox
      mkdir -p $CAMOUFOX_DIR
      # We don't have a direct 'install' command for camofox in the same way,
      # but running the help or a dummy command might trigger it.
      # Skip for now if it's too complex, but let's try.
      # npx @askjo/camofox-browser --help || true
    stage-packages:
      - libnss3
      - libatk1.0-0t64
      - libatk-bridge2.0-0t64
      - libcups2t64
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libasound2t64
      - libpango-1.0-0
      - libcairo2
      - libv4l-0t64
      - libxshmfence1
      - libglu1-mesa
      - libglut3.12

  wrappers:
    plugin: dump
    source: snap/local
    organize:
      hermes-wrapper: bin/hermes-wrapper
