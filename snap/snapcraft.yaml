name: all-dev-hermesagent
base: core24
version: '0.13.0'
summary: The self-improving AI agent
title: Hermes Agent
license: Apache-2.0
contact: developers@nousresearch.com
source-code: https://github.com/NousResearch/hermes-agent
issues: https://github.com/NousResearch/hermes-agent/issues
website: https://hermes-agent.nousresearch.com
description: |
  Hermes is an AI agent that creates skills from experience, 
  improves them during use, and runs anywhere.
  It features advanced tool-calling, web browsing, and 
  cross-platform messaging capabilities.

grade: stable
confinement: strict

apps:
  hermes:
    command: bin/hermes-wrapper hermes
    common-id: all-dev-hermesagent
    plugs:
      - network
      - network-bind
      - ssh-keys
      - removable-media
  agent:
    command: bin/hermes-wrapper hermes-agent
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
      - ssh-keys
      - removable-media
  acp:
    command: bin/hermes-wrapper hermes-acp
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  ct-engine:
    command: bin/ct-engine run
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  dashboard:
    command: bin/hermes-wrapper dashboard-service
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  gateway:
    command: bin/hermes-wrapper gateway-service
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  config-watcher:
    # Applies web-UI config changes: watches $SNAP_COMMON/.env + config.yaml and
    # reconciles the gateway service (via snapctl) so a token saved in the
    # dashboard takes effect without `snap set`. Starts on install (no
    # install-mode: disable); controllable via `snap set … config-watcher-service`.
    command: bin/hermes-wrapper config-watcher
    daemon: simple
    restart-condition: always


parts:
  all-snap-plugin:
    plugin: dump
    source: ../all_snap_plugin
    organize:
      src/ct_engine.py: bin/ct-engine
      snap/hooks/configure: snap/hooks/configure
      snap/hooks/pre-refresh: snap/hooks/pre-refresh
      snap/hooks/post-refresh: snap/hooks/post-refresh
      snap/hooks/remove: snap/hooks/remove
      docs: plugin-docs
      examples: plugin-examples
    stage:
      - bin/ct-engine
      - snap/hooks/configure
      - snap/hooks/pre-refresh
      - snap/hooks/post-refresh
      - snap/hooks/remove
      - plugin-docs
      - plugin-docs/**
      - plugin-examples
      - plugin-examples/**

  web-frontend:
    plugin: npm
    source: web/
    npm-include-node: true
    npm-node-version: '20'
    override-build: |
      export NODE_ENV=development
      npm install --include=dev
      npm run sync-assets
      npx tsc -b
      npx vite build
      mkdir -p $CRAFT_PART_INSTALL/hermes_cli/web_dist
      cp -r ../hermes_cli/web_dist/* $CRAFT_PART_INSTALL/hermes_cli/web_dist/

  
  hermes:
    plugin: python
    after: [web-frontend]
    source: .
    python-packages:
      - .[all]
    build-packages:
      - libffi-dev
      - libssl-dev
      - pkg-config
    stage-packages:
      - git
      - ripgrep
      - ffmpeg
      - curl

  browser-tools:
    plugin: npm
    source: .
    stage:
      - -README.md
    npm-include-node: true
    npm-node-version: '20'
    build-packages:
      - python3
      - make
      - g++
    override-build: |
      # Install dependencies locally to get agent-browser binary
      npm install
      
      # Force agent-browser to install into the part's install dir
      export HOME=$CRAFT_PART_INSTALL
      ./node_modules/.bin/agent-browser install
      
      # Move to a cleaner location and cleanup the fake HOME
      mkdir -p $CRAFT_PART_INSTALL/usr/share/playwright
      mv $CRAFT_PART_INSTALL/.agent-browser/browsers/* $CRAFT_PART_INSTALL/usr/share/playwright/
      rm -rf $CRAFT_PART_INSTALL/.agent-browser
      
      # Global install — skip postinstall scripts.
      # Use --install-links to avoid symlinks pointing outside the snap.
      unset HOME
      npm install -g --ignore-scripts --install-links --prefix $CRAFT_PART_INSTALL .
      
      # Bundle Camoufox directory (empty placeholder if fetch isn't available)
      mkdir -p $CRAFT_PART_INSTALL/usr/share/camoufox
    stage-packages:
      - libnss3
      - libatk1.0-0t64
      - libatk-bridge2.0-0t64
      - libcups2t64
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libasound2t64
      - libpango-1.0-0
      - libcairo2
      - libv4l-0t64
      - libxshmfence1
      - libglu1-mesa
      - libglut3.12

  wrappers:
    # override-build so the launcher + service-orchestration scripts are staged
    # into bin/ with explicit executable perms (independent of source-tree perms).
    plugin: nil
    source: .
    override-build: |
      set -e
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      install -m 0755 snap/local/hermes-wrapper     "$CRAFT_PART_INSTALL/bin/hermes-wrapper"
      install -m 0755 snap/local/config-watcher      "$CRAFT_PART_INSTALL/bin/config-watcher"
      install -m 0755 snap/local/reconcile-services  "$CRAFT_PART_INSTALL/bin/reconcile-services"
      install -m 0644 plugin.yaml                     "$CRAFT_PART_INSTALL/plugin.yaml"
    stage:
      - bin/hermes-wrapper
      - bin/config-watcher
      - bin/reconcile-services
      - plugin.yaml
